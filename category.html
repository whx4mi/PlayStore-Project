<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Google Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="./store-runtime.js" defer></script>
  <style>
    :root{--green:#01875f;--ink:#202124;--muted:#5f6368;--line:#e8eaed}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Roboto,Arial,sans-serif;font-size:16px;background:#fff}button,input{font:inherit}
    .topbar{height:64px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid #f1f3f4;background:rgba(255,255,255,.97);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#5f6368;font-size:22px;white-space:nowrap}.playmark{width:30px;height:32px}.topnav{display:flex;align-self:stretch;margin-left:40px;gap:30px}.topnav a{position:relative;display:flex;align-items:center;text-decoration:none;font-weight:500;color:#5f6368}.topnav a.active{color:var(--green)}.topnav a.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--green)}.actions{margin-left:auto;display:flex;align-items:center;gap:8px}.iconbtn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer}.iconbtn:hover{background:#f1f3f4}.iconbtn svg{width:24px;height:24px;fill:#5f6368}.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#4677d7,#78b5ff);color:#fff;font-size:14px;display:grid;place-items:center}
    .search{display:none;position:absolute;inset:8px 76px 8px 72px;background:#f1f3f4;border-radius:8px;align-items:center;gap:12px;padding:0 15px}.search.open{display:flex}.search input{border:0;outline:0;background:transparent;flex:1;font-size:17px}
    main{max-width:1420px;margin:auto;padding:34px 46px 70px}.chips{display:flex;gap:10px;margin-bottom:38px;overflow-x:auto}.chip{border:1px solid #dadce0;border-radius:20px;background:#fff;padding:10px 17px;white-space:nowrap;color:#3c4043}.chip.active{border-color:#a8d5c1;background:#eef7f2;color:#056449}
    .hero{min-height:285px;border-radius:24px;padding:42px 48px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(135deg,#075fc5,#1689ff 58%,#61b0ff);position:relative;overflow:hidden;margin-bottom:42px}.hero:after{content:"";position:absolute;width:310px;height:310px;border-radius:50%;right:-50px;top:-70px;background:rgba(255,255,255,.16)}.hero-copy{position:relative;z-index:1;max-width:610px}.hero small{font-weight:700;letter-spacing:.06em}.hero h1{font-size:34px;line-height:1.15;margin:9px 0}.hero p{font-size:17px;line-height:1.5;margin:0;opacity:.95}.hero.apps{background:linear-gradient(135deg,#075fc5,#1689ff 58%,#61b0ff)}.hero.movies{background:linear-gradient(135deg,#391465,#7d2aae 58%,#c257d2)}.hero.books{background:linear-gradient(135deg,#7a3100,#d06b05 58%,#f7ad32)}.hero.kids{background:linear-gradient(135deg,#006c55,#04a984 58%,#61dcb8)}
    .section{margin:0 0 42px}.section h2{font-size:24px;font-weight:500;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px}.card{min-width:0;cursor:pointer}.visual{aspect-ratio:1;border-radius:22px;display:flex;align-items:flex-end;padding:16px;color:#fff;font-weight:700;font-size:18px;box-shadow:0 1px 2px rgba(0,0,0,.1);transition:.2s;overflow:hidden;position:relative}.card:hover .visual{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.14)}.card.app .visual{padding:0;background:#e8eaed}.card.app .visual img{width:100%;height:100%;object-fit:cover}.card strong{display:block;font-size:14px;font-weight:500;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card span{display:block;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c1{background:linear-gradient(145deg,#081b32,#2c6c98)}.c2{background:linear-gradient(145deg,#4f0f28,#d43f62)}.c3{background:linear-gradient(145deg,#102b1c,#5a9d54)}.c4{background:linear-gradient(145deg,#332056,#8c6bc7)}.c5{background:linear-gradient(145deg,#5e3c00,#d78f22)}.c6{background:linear-gradient(145deg,#063d47,#34a8ae)}.poster{aspect-ratio:2/3;border-radius:10px;padding:14px;align-items:flex-end}.book{aspect-ratio:3/4;border-radius:8px;padding:14px}.kids-card{border-radius:50%;padding:24px;align-items:center;justify-content:center;text-align:center}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#303134;color:#fff;border-radius:6px;padding:13px 18px;font-size:14px;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}footer{border-top:1px solid var(--line);padding:30px 46px;color:var(--muted);font-size:13px}.foot{max-width:1420px;margin:auto;display:flex;gap:26px;flex-wrap:wrap}
    .image-fallback{object-fit:contain!important;background:#eef7f2!important;padding:14px!important}.card:focus-visible{outline:3px solid #8ab4f8;outline-offset:4px;border-radius:12px}.empty-state{text-align:center;padding:42px 20px;color:var(--muted);border:1px dashed #dadce0;border-radius:18px;margin:16px 0 36px}.empty-state strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.topnav{display:none}main{padding:24px 20px 55px}.grid{grid-template-columns:repeat(3,1fr);gap:16px}.hero{padding:30px;min-height:240px}.hero h1{font-size:29px}.search{inset:8px 60px 8px 12px}}@media(max-width:480px){.topbar{height:58px;padding:0 14px}.brand{font-size:20px}.playmark{width:27px}.grid{grid-template-columns:repeat(2,1fr)}.visual{border-radius:18px}.hero{padding:24px}.actions .help{display:none}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="./index.html"><svg class="playmark" viewBox="0 0 32 36"><path fill="#00d17a" d="M2 2l18 16L2 34z"/><path fill="#0185ff" d="M2 2l21 12-3 4z"/><path fill="#ffca28" d="M20 18l3 4L2 34z"/><path fill="#ff4b55" d="M23 14l7 4-7 4-3-4z"/></svg><span>Google Play</span></a><nav class="topnav"><a data-tab="games" href="./index.html">Jogos</a><a data-tab="apps" href="?tab=apps">Apps</a><a data-tab="movies" href="?tab=movies">Filmes e TV</a><a data-tab="books" href="?tab=books">Livros</a><a data-tab="kids" href="?tab=kids">Crianças</a></nav><div class="actions"><button class="iconbtn" id="searchOpen" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><path d="M9.5 3a6.5 6.5 0 1 0 3.98 11.64L19.85 21 21 19.85l-6.36-6.37A6.5 6.5 0 0 0 9.5 3zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg></button><button class="iconbtn help" aria-label="Ajuda"><svg viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/></svg></button><div class="avatar">A</div></div><form class="search" id="search"><input id="searchInput" placeholder="Pesquisar nesta categoria" aria-label="Pesquisar"><button type="button" class="iconbtn" id="searchClose">✕</button></form></header>
  <main><div class="chips" id="chips"></div><section class="hero" id="hero"><div class="hero-copy"><small id="eyebrow"></small><h1 id="title"></h1><p id="subtitle"></p></div></section><div class="empty-state" id="emptyState" hidden><strong>Nenhum resultado encontrado</strong><span>Tente pesquisar com outro nome.</span></div><div id="content"></div></main>
  <footer><div class="foot"><span>Termos de Serviço</span><span>Privacidade</span><span>Sobre o Google Play</span><span>Desenvolvedores</span><span>Brasil (Português)</span></div></footer><div class="toast" id="toast"></div>
  <script>
    const iconUrls={privchat:'./privchat-v2.png',sky:'https://play-lh.googleusercontent.com/CxUJ-s6QRm3MtiJ92mh3euIx_rp5XvmZtVmoHXJaLsFXURIMf_XcH9uHANbQ00CUUPkSHcIZBqIhC0OC9yV6Iw=w240-h480',balatro:'https://play-lh.googleusercontent.com/A3TixeAj-tHxxvfuIPvkPZxXGdG7c9wynmbZq0m4HSwcogS4KdLn1Ia69_xZ67hL2wwEySv2--O5f79PVYRy=w240-h480',poly:'https://play-lh.googleusercontent.com/_XOGXn-bwLMfsaeGMdIkMFtj4zBgTUldfJpFMS76akYHNLZX2oXKvwiPsmE3o0DLE9p-gM_CU8nLc6WbdKpREQ=w240-h480',reigns:'https://play-lh.googleusercontent.com/wuVux_DBI3l9ZfkgheMS89aapgQwgzew5f1noZIB01JchoGX8bmwrA6-w7SqdLZZqunYi_gY2IGgFZKHcqVXmg=w240-h480',monument:'https://play-lh.googleusercontent.com/TWEL-jxgfYY3KPfU0X2bQsGW5ho-n0NR72768VPOsRycD1luFqTG3jjpHUvZlvjPeCpMUI1sx4gmjBwrQ_HP=w240-h480'};
    const data={
      apps:{eyebrow:'INNOVATION CORNER',title:'Grandes ideias de empresas em ascensão',subtitle:'Conheça apps de produtividade, bem-estar e criatividade que estão ganhando espaço.',chips:['Telefone','Tablet','TV','Desktop','Relógio','Carro'],sections:[['Innovation Corner',[['PrivChat','Comunicação · 4,7 ★','app',iconUrls.privchat,'privchat'],['Focus Friend by Hank Green','Produtividade · 4,9 ★','app',iconUrls.poly],['MINDTRX: Self Improvement','Saúde e fitness · 3,8 ★','app',iconUrls.sky],['Notion Calendar','Produtividade · 3,4 ★','app',iconUrls.monument],['Coconote - AI Note Taker','Educação · 4,6 ★','app',iconUrls.reigns],['Habitica: Gamify Your Tasks','Produtividade · 4,7 ★','app',iconUrls.balatro]]],['Apps favoritos',[['WhatsApp Messenger','Comunicação · 4,6 ★','app',iconUrls.monument],['Apple Music','Música e áudio · 4,6 ★','app',iconUrls.privchat],['Facebook Lite','Social · 4,5 ★','app',iconUrls.sky],['Instagram','Social · 4,0 ★','app',iconUrls.poly],['ChatGPT','Produtividade · 4,8 ★','app',iconUrls.reigns],['InShot: Editor de Vídeo e Foto','Fotografia · 4,8 ★','app',iconUrls.balatro]]]]},
      movies:{eyebrow:'FILMES E TV',title:'Novo: compre ou alugue',subtitle:'Lançamentos recentes, documentários e grandes sucessos disponíveis no Google TV.',chips:['Filmes','TV','Família'],sections:[['Novo: compre ou alugue',[['It Hunts','1,0 ★ · US$ 3,99','poster c1'],['The Currents','US$ 4,99','poster c2'],['Angel in the Rubble','US$ 2,99','poster c3'],['The Premiere','US$ 3,99','poster c4'],['Christmas Lilies of The Field','US$ 1,99','poster c5'],['The Other People','5,0 ★ · US$ 3,99','poster c6']]],['Maiores sucessos do Google TV',[['Hotel by the River','4,3 ★ · US$ 3,99','poster c4'],['Growing Up Grizzly','3,6 ★ · US$ 1,99','poster c5'],['The Pilot','4,1 ★ · US$ 3,99','poster c1'],['Bill Hicks: One Night Stand','4,0 ★ · US$ 2,99','poster c2'],['Afraid','3,9 ★ · US$ 3,99','poster c3'],['Clockwatchers','4,5 ★ · US$ 1,99','poster c6']]]]},
      books:{eyebrow:'LIVROS',title:'Novos descontos em e-books',subtitle:'Ofertas fresquinhas e títulos populares para a sua próxima leitura.',chips:['E-books','Audiolivros','Sua biblioteca','Lista de desejos'],sections:[['Ofertas fresquinhas',[['O Poder do Evangelho na Neuroplasticidade','4,6 ★ · R$ 21,99','book c1'],['O Alerta de Quem Constrói a IA','4,2 ★ · R$ 0,99','book c2'],['Conseguir Emprego','4,3 ★ · R$ 4,99','book c3'],['A Consciência da Desilusão','4,1 ★ · R$ 4,99','book c4'],['Encontre Seu Fluxo','4,5 ★ · R$ 4,99','book c5'],['As 100 Regras do Dinheiro','4,4 ★ · R$ 4,99','book c6']]],['Os mais vendidos',[['Como fazer amigos e influenciar pessoas','4,4 ★ · R$ 23,74','book c5'],['As 48 leis do poder','4,3 ★ · R$ 40,76','book c3'],['O poder do subconsciente','4,7 ★ · R$ 14,90','book c4'],['Jantar secreto','4,8 ★ · R$ 19,90','book c1'],['Verity','4,7 ★ · R$ 37,90','book c2'],['Harry Potter e a Pedra Filosofal','4,7 ★ · R$ 29,90','book c6']]]]},
      kids:{eyebrow:'CRIANÇAS',title:'Apps e jogos aprovados por professores',subtitle:'Conteúdo selecionado para crianças aprenderem, brincarem e crescerem com segurança.',chips:['Todas as idades até 12 anos','Até 5 anos','De 6 a 8 anos','De 9 a 12 anos'],sections:[['Novos e atualizados',[['Toca Boca World','4,3 ★','kids-card c5'],['Bebê Panda: cuidado dental','4,6 ★','kids-card c3'],['Towniz World: Avatar Life','4,3 ★','kids-card c4'],['Jogos de cozinhar para bebê 2+','4,6 ★','kids-card c1'],['Jogos infantis para bebês de 2','3,9 ★','kids-card c2'],['Baby Care, dress up kids Games','4,4 ★','kids-card c6']]],['Jogos infantis',[['Avatar World ®','4,8 ★','kids-card c3'],['PBS KIDS Games','4,4 ★','kids-card c4'],['Toca Boca Hair Salon 4','3,8 ★','kids-card c1'],['Sago Mini World: Jogos Infantis','3,8 ★','kids-card c2'],['Jogo do Dentista para Crianças','4,5 ★','kids-card c5'],['Pinkfong Bebê Tubarão: Jogos','3,6 ★','kids-card c6']]]]}
    };
    const params=new URLSearchParams(location.search);const tab=data[params.get('tab')]?params.get('tab'):'apps';const selected=data[tab];document.title=`${tab==='movies'?'Filmes e TV':tab==='books'?'Livros':tab==='kids'?'Crianças':'Apps'} – Google Play`;document.querySelector(`[data-tab="${tab}"]`).classList.add('active');document.getElementById('chips').innerHTML=selected.chips.map((chip,index)=>`<button class="chip${index===0?' active':''}">${chip}</button>`).join('');const hero=document.getElementById('hero');hero.classList.add(tab);document.getElementById('eyebrow').textContent=selected.eyebrow;document.getElementById('title').textContent=selected.title;document.getElementById('subtitle').textContent=selected.subtitle;
    function cardHTML(item){const [name,meta,style,img,target]=item;if(style==='app')return `<article class="card app" data-name="${name}" data-target="${target||''}"><div class="visual"><img src="${img}" alt="Ícone de ${name}"></div><strong>${name}</strong><span>${meta}</span></article>`;return `<article class="card" data-name="${name}"><div class="visual ${style}">${name}</div><strong>${name}</strong><span>${meta}</span></article>`}
    document.getElementById('content').innerHTML=selected.sections.map(section=>`<section class="section"><h2>${section[0]}</h2><div class="grid">${section[1].map(cardHTML).join('')}</div></section>`).join('');
    let toastTimer;function showToast(text){const toast=document.getElementById('toast');toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
    document.addEventListener('click',event=>{const card=event.target.closest('.card');if(!card)return;if(card.dataset.target==='privchat'){location.href='./privchat.html';return}showToast(`${card.dataset.name} é um conteúdo demonstrativo`)});
    const search=document.getElementById('search'),searchInput=document.getElementById('searchInput'),emptyState=document.getElementById('emptyState');
    function filterCards(){const query=searchInput.value.toLocaleLowerCase('pt-BR').trim();let visible=0;document.querySelectorAll('.card').forEach(card=>{const matches=!query||card.dataset.name.toLocaleLowerCase('pt-BR').includes(query);card.style.display=matches?'':'none';if(matches)visible++});emptyState.hidden=visible>0}
    document.getElementById('searchOpen').onclick=()=>{search.classList.add('open');searchInput.focus()};
    document.getElementById('searchClose').onclick=()=>{search.classList.remove('open');searchInput.value='';filterCards()};
    search.onsubmit=event=>event.preventDefault();searchInput.oninput=filterCards;
    document.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(item=>item.classList.remove('active'));chip.classList.add('active');showToast(`Mostrando conteúdo para ${chip.textContent}`)}));
  </script>
</body>
</html>
